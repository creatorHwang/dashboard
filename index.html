    return;
  }

  const t1rows = b.track1.map(r=>`<tr>
    <td class="num"><b>${r.m}</b></td>
    <td class="num">${r.면담}</td><td class="num">${r.모임}</td>
    <td class="num">${r.영업}</td><td class="num">${r.개설}</td>
    <td><span class="cm">${r.cm}</span></td></tr>`).join('');

  // Track2: 정렬 모드에 따라 재구성 가능 (기본=우선순위)
  const t2rows = buildTrack2Rows(m, b, route.mgr, route.br);

  const lowList = b.centers.filter(isLowCenter).map(c=>c.name).join(', ') || '없음';

  // ── 분석 블록 계산 ──
  const exec = buildExecSummary(b);
  const h = healthMetrics(b);
  const kpi = kpiTotals(b);
  const swot = buildSWOT(b);
  const guide = buildGuide(b);
  const top5 = topInterviewCenters(b,5);

  const deltaHtml=(d)=> d>0?`<span class="k-delta delta-up">▲ +${d}</span>`
    : d<0?`<span class="k-delta delta-down">▼ ${d}</span>`
    : `<span class="k-delta delta-flat">→ 동일</span>`;
  const kpiCard=(label,obj,unit)=>`<div class="kpi"><div class="k-label">${label}</div>
    <div class="k-val">${obj.v}${unit}</div>${deltaHtml(obj.d)} <span style="font-size:11px;color:var(--muted)">전월대비</span></div>`;

  const swotCell=(cls,title,arr)=>`<div class="swot-cell ${cls}"><div class="sw-t">${title}</div><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;

  const top5Html = top5.length ? top5.map((c,i)=>{
    const t=memTrend(c); const reasons=[];
    if(t.diff<0) reasons.push(`회원 ${t.first}→${t.last}명 감소(${t.pct}%)`);
    if(isLowCenter(c)) reasons.push('저실적');
    if(c.mng.months.length===0) reasons.push('전 기간 미면담');
    else if(c.mng.months.length<=1) reasons.push('면담 공백');
    const v=memValid(c); if(v.length&&v[0]===0&&t.last<=threshold(c.form)) reasons.push('신설 후 정체');
    return `<div class="top5-row">
      <div class="rank-badge rank-${i+1}">${i+1}</div>
      <div class="top5-body"><div class="top5-name">${c.name} <span style="font-weight:400;color:var(--muted);font-size:12px">${c.form}</span></div>
      <div class="top5-reason">${reasons.join(' · ')||'관리 점검 필요'}</div></div>
      <div class="top5-spark">${sparkline(c.mem)}</div></div>`;
  }).join('') : `<div class="top5-empty">긴급 면담 대상 없음 — 전 센터 안정 관리 중입니다.</div>`;

  app.innerHTML = `
    <div class="branch-head-sticky">
      <button class="back-btn" style="margin:0 0 14px" onclick='go({view:"mgr",mgr:${route.mgr}})'>‹ 본부 목록으로</button>
      <h2 class="mgr">👤 매니저: ${m.name}</h2>
      <h3 class="hb">🏢 가맹본부: ${b.name} 가맹지역본부</h3>
      <div class="center-quick-pick">
        <label>🔒 센터 정보 바로보기</label>
        <select onchange="if(this.value!=='') openCenterDetail(${route.mgr},${route.br},+this.value); this.value=''">
          <option value="">센터 선택…</option>
          ${b.centers.map((c,ci)=>`<option value="${ci}">${c.name}</option>`).join('')}
        </select>
      </div>
    </div>

    <!-- ① AI Executive Summary -->
    <div class="ai-summary">
      <div class="ai-tag">🤖 AI 종합 분석</div>
      <p>${exec}</p>
    </div>

    <!-- ② 건강도 Score Card + Radar -->
    <div class="dash-grid2">
      <div class="card-box">
        <h4>📊 활동 KPI Dashboard</h4>
        <div class="kpi-row" style="margin-bottom:0">
          ${kpiCard('센터 면담',kpi.면담,'건')}
          ${kpiCard('지역 모임',kpi.모임,'회')}
          ${kpiCard('영업 활동',kpi.영업,'건')}
          ${kpiCard('개설 상담',kpi.개설,'건')}
        </div>
        <div class="trend-wrap" style="margin-top:16px"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="score-card">
        <h4 style="font-size:14px;margin-bottom:12px;border-bottom:2px solid var(--ink);padding-bottom:8px">🩺 본부 건강도</h4>
        <div class="score-top">
          <div><div class="score-num">${h.score}<span style="font-size:18px;color:var(--muted)">점</span></div>
          <div class="score-label">관리율 ${h.관리율.toFixed(0)}% · 증가 ${h.inc} / 감소 ${h.dec}</div></div>
          <div class="score-badge grade-${h.grade.k}">${h.grade.t}</div>
        </div>
        <div class="radar-wrap"><canvas id="radarChart"></canvas></div>
      </div>
    </div>

    <!-- ⑤⑥ SWOT + 면담 가이드 -->
    <div class="dash-grid2b">
      <div class="card-box">
        <h4>🧭 SWOT 자동 분석</h4>
        <div class="swot-grid">
          ${swotCell('sw-s','STRENGTH',swot.S)}
          ${swotCell('sw-w','WEAKNESS',swot.W)}
          ${swotCell('sw-o','OPPORTUNITY',swot.O)}
          ${swotCell('sw-t2','THREAT',swot.T)}
        </div>
      </div>
      <div class="card-box">
        <h4>🗣️ 이번 달 면담 가이드</h4>
        <ul class="guide-list">
          ${guide.Q.map((q,i)=>`<li><span class="guide-q">${i+1}.</span>${q}</li>`).join('')}
        </ul>
        <div style="font-size:12px;font-weight:800;color:var(--pine);margin-top:12px">권장 Action</div>
        <ul class="action-list">${guide.A.map(a=>`<li>${a}</li>`).join('')}</ul>
      </div>
    </div>

    <!-- ⑦ 이번 달 면담 TOP5 -->
    <div class="top5">
      <h4>🚨 이번 달 반드시 면담해야 할 센터 TOP 5</h4>
      ${top5Html}
    </div>

    <!-- ⑧ 기존 Track1 -->
    <div class="track">
      <div class="t-head"><span class="badge">TRACK 1</span><h4>본부 월별 활동 내역</h4></div>
      <div class="overall"><b>종합 코멘트</b> — ${b.overall}</div>
      <table>
        <thead><tr><th class="num">분석 월</th><th class="num">센터 면담</th><th class="num">지역 모임</th><th class="num">영업 활동</th><th class="num">개설 활동</th><th>종합 코멘트 (MD 발췌)</th></tr></thead>
        <tbody>${t1rows}</tbody>
      </table>
    </div>

    <!-- 본부 매니저 메모 (Track1 바로 아래) -->
    ${branchMemoPanelHtml(m.name,b.name)}

    <!-- ⑨ 개선된 Track2 -->
    <div class="track">
      <div class="t-head"><span class="badge">TRACK 2</span><h4>센터별 실적 및 집중 관리 보드 <span style="font-size:12px;font-weight:400;color:var(--muted)">— 센터명 클릭 시 상세</span></h4></div>
      ${t2FilterBarHtml(b.name)}
      <table class="track2-table">
        <thead><tr><th class="num">우선순위</th><th>센터명</th><th class="num">개설형태</th>
          ${MONTH_LABELS.map(l=>`<th class="num">${l}</th>`).join('')}
          <th class="num">면담 히트맵</th><th class="num">회원 추세</th><th class="num">위험도</th></tr></thead>
        <tbody id="t2body-${t2Key(b.name)}">${t2rows}</tbody>
      </table>
      <div class="legend">🚨 저실적 기준 — 학원(상가형·IGSE·숲): 15명 이하 · 교습소: 10명 이하 · 공부방: 5명 이하<br>
      🟩 면담 히트맵: 채워진 칸 = 해당 월 면담 · 회원 추세: 첫→최신월 증감 · 위험도: 감소·저실적·면담공백·최근추세 종합<br>
      우선순위: 1️⃣ 감소+미면담 · 2️⃣ 저실적 · 3️⃣ 감소 · 4️⃣ 관리중 · <b>센터명 클릭</b> 시 회원 추이 그래프·월별 코멘트·메모 로그 확인<br>
      <b>저실적 센터</b>: ${lowList}</div>
      ${b.matching?`<div class="note">⚠ ${b.matching}</div>`:''}
    </div>`;

  // ── 차트 렌더 (Chart.js) ──
  drawRadar(h.axes);
  drawTrend(b);
  initBranchMemo(m.name,b.name);
}

// 차트 인스턴스 관리(재진입 시 파기)
let _radar=null,_trend=null;
function drawRadar(axes){
  if(typeof Chart==='undefined')return;
  const el=document.getElementById('radarChart'); if(!el)return;
  if(_radar)_radar.destroy();
  _radar=new Chart(el,{type:'radar',
    data:{labels:['관리율','면담율','회원증감','영업활동','개설활동'],
      datasets:[{data:[axes.관리율,axes.면담율,axes.회원증감,axes.영업활동,axes.개설활동],
        fill:true,backgroundColor:'rgba(47,93,80,.18)',borderColor:'#2f5d50',
        pointBackgroundColor:'#2f5d50',borderWidth:2,pointRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{r:{min:0,max:100,ticks:{stepSize:25,font:{size:9},color:'#9aa0a6',backdropColor:'transparent'},
        pointLabels:{font:{size:11,weight:'600'},color:'#1c2431'},grid:{color:'#e3e6de'},angleLines:{color:'#e3e6de'}}},
      plugins:{legend:{display:false}}}});
}
function drawTrend(b){
  if(typeof Chart==='undefined')return;
  const el=document.getElementById('trendChart'); if(!el)return;
  if(_trend)_trend.destroy();
  const labels=b.track1.map(r=>r.m);
  const ser=(k)=>b.track1.map(r=>+r[k]||0);
  const mk=(label,key,color)=>({label,data:ser(key),borderColor:color,backgroundColor:color,
    tension:.3,borderWidth:2,pointRadius:3,pointHoverRadius:5});
  _trend=new Chart(el,{type:'line',
    data:{labels,datasets:[
      mk('센터면담','면담','#2f5d50'),
      mk('지역모임','모임','#b4762a'),
      mk('영업활동','영업','#2b6cb0'),
      mk('개설활동','개설','#c0392b')]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      scales:{y:{beginAtZero:true,ticks:{precision:0,font:{size:10},color:'#9aa0a6'},grid:{color:'#eef0ea'}},
        x:{ticks:{font:{size:11},color:'#1c2431'},grid:{display:false}}},
      plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12,padding:12}}}}});
}

render();
// 시작 시 클라우드에서 최신 메모 불러오기(설정된 경우)
setCloudStatus(CLOUD_URL?'sync':'off');
cloudPull();
</script>
</body>
</html>
