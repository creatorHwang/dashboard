<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가맹본부 투트랙 캔버스</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1c2431; --paper:#f6f7f4; --card:#ffffff; --line:#dfe3da;
  --pine:#2f5d50; --pine-soft:#e6efe9; --amber:#b4762a; --alert:#c0392b; --alert-bg:#fdeeec;
  --muted:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
header.top{border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
header.top h1{font-size:21px;letter-spacing:-.3px}
header.top h1 .tag{display:inline-block;background:var(--pine);color:#fff;font-size:11px;padding:3px 8px;border-radius:3px;vertical-align:3px;margin-left:8px;letter-spacing:.5px}
header.top .period{font-size:12.5px;color:var(--muted)}
.crumbs{font-size:13px;margin-bottom:18px;color:var(--muted)}
.crumbs a{color:var(--pine);text-decoration:none;font-weight:600;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs span.sep{margin:0 6px;color:#c4c9be}

/* main: manager list */
.mgr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mgr-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:8px;padding:20px 18px;cursor:pointer;transition:transform .12s, box-shadow .12s}
.mgr-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(28,36,49,.10)}
.mgr-card .who{font-size:18px;font-weight:800}
.mgr-card .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.hint{font-size:12.5px;color:var(--muted);margin-top:16px}

/* branch list */
.br-list{display:grid;gap:12px}
.br-row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:border-color .12s}
.br-row:hover{border-color:var(--pine)}
.br-row .nm{font-size:16px;font-weight:700}
.br-row .stats{font-size:12.5px;color:var(--muted)}
.br-row .stats b.warn{color:var(--alert)}
.br-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.br-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:8px;padding:16px 16px;cursor:pointer;transition:transform .12s, box-shadow .12s}
.br-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(28,36,49,.10)}
.br-card .bc-name{font-size:15px;font-weight:800}
.br-card .bc-meta{font-size:12px;color:var(--muted);margin-top:6px}
.br-card .bc-meta b.warn{color:var(--alert)}
.br-card.placeholder{border-left-color:var(--amber);border-style:dashed;background:#fbfaf6}
.br-card.placeholder:hover{box-shadow:0 6px 16px rgba(180,118,42,.12)}
.arrow{color:var(--pine);font-weight:700}

/* branch detail */
h2.mgr{font-size:20px;margin-bottom:2px}
h3.hb{font-size:16px;color:var(--pine);margin-bottom:16px;font-weight:700}
.track{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 20px;margin-bottom:22px}
.track .t-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.track .t-head .badge{font-size:11px;font-weight:800;letter-spacing:.8px;color:#fff;background:var(--ink);padding:3px 8px;border-radius:3px}
.track .t-head h4{font-size:15px}
.overall{background:var(--pine-soft);border-left:4px solid var(--pine);padding:10px 12px;font-size:13px;line-height:1.55;border-radius:0 6px 6px 0;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#eef0ea;border:1px solid var(--line);padding:8px 8px;font-size:12px;white-space:nowrap}
td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;line-height:1.5}
td.num,th.num{text-align:center;white-space:nowrap}
td.warn{background:var(--alert-bg);color:var(--alert);font-weight:700}
td.stat-low{color:var(--alert);font-weight:800}
td.stat-ok{color:var(--pine);font-weight:600}
td .cm{font-size:12px;color:#3d4657}
tr.low-row td:first-child{border-left:4px solid var(--alert)}
.legend{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.note{font-size:12px;color:var(--amber);margin-top:8px}
.back-btn{display:inline-block;margin-top:6px;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.back-btn:hover{border-color:var(--pine);color:var(--pine)}
.br-row.placeholder{border-style:dashed;background:#fbfaf6}
.br-row.placeholder:hover{border-color:var(--amber)}
.pill{display:inline-block;background:var(--amber);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:10px;vertical-align:2px;margin-left:6px;font-weight:700}
.track.empty{text-align:center;padding:40px 24px;border-style:dashed}
.empty-icon{font-size:38px}
.empty-title{font-size:17px;font-weight:800;margin:8px 0 4px}
.empty-desc{font-size:13px;color:var(--muted);max-width:620px;margin:0 auto 18px;line-height:1.6}
.empty-steps{display:inline-flex;flex-direction:column;gap:8px;text-align:left;font-size:13px;color:#3d4657}
.empty-steps .badge{font-size:10px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--ink);padding:2px 7px;border-radius:3px;margin-right:8px}
code{background:#eef0ea;padding:1px 5px;border-radius:3px;font-size:12px}
@media(max-width:720px){ table{font-size:11.5px} th,td{padding:5px 5px} .wrap{padding:20px 10px 60px} }

/* ===== 주간 리포트 ===== */
.rp-btn{margin-left:8px;background:var(--pine);color:#fff;border:none;border-radius:6px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.rp-btn:hover{background:#26493f}
.rp-btn.ghost{background:#fff;color:var(--pine);border:1px solid var(--pine)}
.rp-btn.ghost:hover{background:var(--pine-soft)}
.rp-card{max-width:860px}
.rp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:16px}
.rp-bar select,.rp-bar input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:13px;color:var(--ink)}
.rp-nav{background:var(--pine-soft);color:var(--pine);border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.rp-dl{background:var(--amber);color:#fff;border:none;border-radius:6px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.rp-dl:hover{background:#96601f}
.rp-doc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.rp-head{border-bottom:2px solid var(--pine);padding-bottom:12px;margin-bottom:6px}
.rp-title{font-size:20px;font-weight:800;color:var(--pine)}
.rp-sub{font-size:12px;color:var(--muted);margin-top:4px}
.rp-h{font-size:14px;color:var(--pine);border-bottom:1.5px solid var(--pine);padding-bottom:5px;margin:20px 0 10px}
.rp-tb{width:100%;border-collapse:collapse;margin-bottom:10px}
.rp-tb th,.rp-tb td{border:1px solid var(--line);padding:6px 8px;font-size:12.5px;vertical-align:top;text-align:left}
.rp-tb th{background:var(--pine-soft);font-weight:700;white-space:nowrap}
.rp-sum th{width:90px}
.rp-br{margin-bottom:14px}
.rp-br-t{font-weight:800;font-size:13.5px;margin:12px 0 5px}
.rp-note{font-size:11.5px;color:var(--muted);margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}

/* ===== 인쇄 / PDF (월간 = 기존 대시보드) ===== */
@media print{
  @page{ size:A4; margin:12mm; }
  body{background:#fff !important}
  .wrap{padding:0 !important;max-width:100% !important}
  /* 화면 전용 요소 숨김 */
  .back-btn,.crumbs,.rp-btn,.cloud-status,.no-print,.memo-add,.memo-del,
  .dm-memo-form,.center-link .memo-badge{display:none !important}
  .modal-overlay{position:static !important;background:none !important;padding:0 !important;display:none}
  .modal-overlay.show{display:block !important}
  .modal-card{box-shadow:none !important;max-width:100% !important;padding:0 !important}
  .modal-close{display:none !important}
  /* 카드가 페이지 경계에서 잘리지 않도록 */
  .track,.card-box,.score-card,.top5,.ai-summary,.kpi,.swot-cell,
  .rp-br,.memo-item,.br-card{ break-inside:avoid; page-break-inside:avoid; }
  .dash-grid2,.dash-grid2b{ break-inside:avoid; page-break-inside:avoid; }
  /* 섹션 단위로 페이지 분리 */
  .top5{ page-break-before:always; }
  .track{ page-break-before:always; }
  h3.hb{ page-break-after:avoid; }
  .rp-h{ page-break-after:avoid; }
  /* 표는 머리글 반복 */
  thead{ display:table-header-group; }
  tr{ page-break-inside:avoid; }
  /* 인쇄 시 색 유지 */
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  a{ text-decoration:none; color:inherit }
}


/* ===== 의사결정 대시보드 확장 ===== */
.dash-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px}
.dash-grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:760px){ .dash-grid2,.dash-grid2b{grid-template-columns:1fr} }
.ai-summary{background:linear-gradient(135deg,#233a34 0%,#2f5d50 100%);color:#eef4f1;border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:0 6px 18px rgba(35,58,52,.18)}
.ai-summary .ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;margin-bottom:12px}
.ai-summary p{font-size:14.5px;line-height:1.7;margin:0}
.ai-summary p b{color:#ffd9a8}
.ai-summary .headline{font-size:16px;font-weight:800;margin-bottom:8px;color:#fff}
.score-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.score-top{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:12px}
.score-num{font-size:44px;font-weight:800;line-height:1}
.score-badge{font-size:13px;font-weight:800;padding:5px 12px;border-radius:20px}
.score-label{font-size:12px;color:var(--muted);margin-top:4px}
.grade-good{background:#e4f3ec;color:#1f7a52}
.grade-warn{background:#fdf2e0;color:#a5670f}
.grade-risk{background:var(--alert-bg);color:var(--alert)}
.radar-wrap{position:relative;flex:1;min-height:210px}
.card-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card-box h4{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:7px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media(max-width:760px){ .kpi-row{grid-template-columns:repeat(2,1fr)} }
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-top:4px solid var(--pine)}
.kpi .k-label{font-size:12px;color:var(--muted)}
.kpi .k-val{font-size:26px;font-weight:800;margin:2px 0}
.kpi .k-delta{font-size:12.5px;font-weight:700}
.delta-up{color:var(--alert)}.delta-down{color:#2563eb}.delta-flat{color:var(--muted)}
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swot-cell{border-radius:8px;padding:11px 12px;font-size:12.5px}
.swot-cell .sw-t{font-weight:800;font-size:12px;margin-bottom:6px;letter-spacing:.5px}
.swot-cell ul{margin:0;padding-left:15px;line-height:1.6}
.sw-s{background:#e8f4ee;border-left:4px solid #1f7a52}
.sw-w{background:var(--alert-bg);border-left:4px solid var(--alert)}
.sw-o{background:#e9f0f7;border-left:4px solid #2b6cb0}
.sw-t2{background:#fdf2e0;border-left:4px solid var(--amber)}
.guide-list{list-style:none;padding:0;margin:0}
.guide-list li{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);line-height:1.5}
.guide-list li:last-child{border-bottom:none}
.guide-q{color:var(--pine);font-weight:700;margin-right:6px}
.action-list{list-style:none;padding:0;margin:10px 0 0}
.action-list li{font-size:13px;padding:6px 0;display:flex;gap:8px;align-items:flex-start}
.action-list li::before{content:"\2610";color:var(--pine);font-weight:800}
.top5{background:var(--card);border:2px solid var(--alert);border-radius:12px;padding:18px;margin-bottom:22px}
.top5 h4{font-size:15px;color:var(--alert);margin-bottom:12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--alert);padding-bottom:8px}
.top5-row{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.top5-row:last-child{border-bottom:none}
.rank-badge{flex:none;width:34px;height:34px;border-radius:8px;background:var(--alert);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.rank-2{background:#d9773a}.rank-3{background:var(--amber)}.rank-4{background:#8a8f7d}.rank-5{background:#8a8f7d}
.top5-body{flex:1}
.top5-name{font-weight:800;font-size:14px}
.top5-reason{font-size:12.5px;color:#4a5261;margin-top:2px}
.top5-spark{flex:none;font-family:monospace;font-size:15px;letter-spacing:1px;color:var(--pine)}
.top5-empty{font-size:13px;color:var(--muted);padding:8px 0}
.heat{display:inline-flex;gap:2px;vertical-align:middle}
.heat span{width:13px;height:13px;border-radius:2px;display:inline-block}
.heat .on{background:#2f7a58}.heat .off{background:#e3e6de}
.spark{font-family:monospace;font-size:14px;letter-spacing:.5px;color:var(--pine)}
.spark-mem{font-size:11px;color:var(--muted);margin-left:4px}
.risk-dot{font-size:13px;font-weight:700;white-space:nowrap}
.risk-red{color:var(--alert)}.risk-yel{color:#a5670f}.risk-grn{color:#1f7a52}
.prio-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:10px;white-space:nowrap}
.prio-1{background:var(--alert);color:#fff}.prio-2{background:#d9773a;color:#fff}
.prio-3{background:var(--amber);color:#fff}.prio-4{background:#e4f3ec;color:#1f7a52}
.trend-wrap{position:relative;height:230px}
.trend-cell{white-space:nowrap;font-size:12.5px}
.cloud-status{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;vertical-align:1px}
.cs-on{background:#e4f3ec;color:#1f7a52}
.cs-off{background:#eef0ea;color:#6b7280}
.cs-sync{background:#e9f0f7;color:#2b6cb0}
.cs-err{background:#fdeeec;color:#c0392b}
.center-link{color:var(--pine);font-weight:800;cursor:pointer;text-decoration:none;border-bottom:1px dashed transparent;transition:border-color .12s}
.center-link:hover{border-bottom-color:var(--pine)}
.memo-badge{font-size:10.5px;color:var(--amber);margin-left:5px;font-weight:700;white-space:nowrap}

/* 센터 상세 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(20,26,33,.55);display:none;align-items:flex-start;justify-content:center;z-index:900;padding:30px 16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-card{background:var(--paper);border-radius:14px;max-width:720px;width:100%;padding:24px 24px 28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:modalIn .18s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--ink)}
.dm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.dm-name{font-size:20px;font-weight:800}
.dm-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.dm-tags{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.dm-low{background:var(--alert-bg);color:var(--alert);font-weight:800;font-size:11px;padding:2px 8px;border-radius:10px}
.dm-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:14px}
@media(max-width:620px){ .dm-grid{grid-template-columns:1fr} .dm-grid2{grid-template-columns:1fr} }
.dm-chart-wrap{position:relative;height:200px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.dm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.dm-chart-wrap.small{height:140px}
.dm-mini-title{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.dm-mems{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.dm-mem{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.dm-mem.low{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.dm-mem span{color:var(--muted)}.dm-mem.low span{color:var(--alert)}
.dm-mem b{font-size:13px}
.dm-trend,.dm-crit{grid-column:1/-1;font-size:12px;color:#3d4657;padding:2px}
.dm-crit{color:var(--muted)}
.dm-mng{background:var(--pine-soft);border-left:4px solid var(--pine);border-radius:0 6px 6px 0;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-bottom:18px}
.dm-memo{border-top:1px solid var(--line);padding-top:16px}
.dm-memo-title{font-size:14px;font-weight:800;margin-bottom:10px}
.dm-memo-title span{color:var(--muted);font-weight:600;font-size:12px}
.dm-memo-form{display:flex;gap:8px;margin-bottom:12px}
.memo-date{flex:none;width:140px;border:1px solid var(--line);border-radius:6px;padding:8px;font-family:inherit;font-size:13px;color:var(--ink)}
.memo-text{flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--ink)}
.memo-text:focus,.memo-date:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 2px rgba(47,93,80,.12)}
.memo-add{flex:none;background:var(--pine);color:#fff;border:none;border-radius:6px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.memo-add:hover{background:#26493f}
.dm-memo-log{display:flex;flex-direction:column;gap:8px}
.memo-item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pine);border-radius:7px;padding:9px 11px}
.memo-item-date{flex:none;font-size:12px;font-weight:800;color:var(--pine);width:88px;padding-top:1px}
.memo-item-text{flex:1;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.memo-del{flex:none;background:none;border:none;color:#c4c9be;cursor:pointer;font-size:14px;line-height:1;padding:2px}
.memo-del:hover{color:var(--alert)}
.memo-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:16px;background:var(--card);border:1px dashed var(--line);border-radius:7px}
@media(max-width:620px){ .dm-memo-form{flex-wrap:wrap} .memo-date{width:100%} .memo-item-date{width:70px} }

/* ===== 사이드바 내비게이션 ===== */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 0;overflow-y:auto;
  position:fixed;top:0;left:0;bottom:0;z-index:60}
.sidebar .sb-brand{font-size:14px;font-weight:800;color:var(--pine);padding:0 18px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}

/* ===== 저실적 판정 (개설형태별 기준) ===== */
function threshold(form){
  if(form.startsWith('학원')) return 15;   // 상가형·IGSE·숲
  if(form==='교습소') return 10;
  if(form==='공부방') return 5;
  return 0;
}
function isLowMonth(c,i){ const v=c.mem[i]; return v!==null && v!==undefined && v<=threshold(c.form); }
function isLowCenter(c){ return c.mem.some((_,i)=>isLowMonth(c,i)); }

     쓰기는 캐시+localStorage 즉시 반영 후 백그라운드로 시트에 전송.
   ============================================================ */
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwNhaDXFVqrJ6i9LMhz9mqj9vlQYVtSl0eOrlpbV_qXYLyA4fshBWZrc0KJnZUyCPs/exec"; // Apps Script 웹앱 URL

const MEMO_NS='fc_center_memo_v2';
const OLD_MEMO_NS='fc_center_memo_v1';
const _memoFallback={};
let _cache=null;            // 메모리 캐시(동기 읽기용) — 진실의 원천
let _cloudReady=false;      // 시트 동기화 성공 여부

function memoKey(mgrName,brName,cName){ return `${mgrName}>${brName}>${cName}`; }
function _readLocal(ns){ try{ return JSON.parse(localStorage.getItem(ns)||'{}'); }catch(e){ return null; } }
function _writeLocal(store){ try{ localStorage.setItem(MEMO_NS,JSON.stringify(store)); }catch(e){ Object.assign(_memoFallback,store); } }

// 로컬(브라우저) 저장분 로드 + 구버전 마이그레이션
function _loadLocalStore(){
  let store=_readLocal(MEMO_NS);
  if(store===null) store={..._memoFallback};
  const old=_readLocal(OLD_MEMO_NS);
  if(old && Object.keys(old).length){
    let changed=false;
    Object.entries(old).forEach(([k,v])=>{ if(v && !store[k]){ store[k]=[{date:'',text:String(v),ts:Date.now()}]; changed=true; } });
    if(changed){ _writeLocal(store); try{ localStorage.removeItem(OLD_MEMO_NS);}catch(e){} }
  }
  return store;
}
// 캐시 보장(최초 1회 로컬에서 채움)
function normalizeStore(store){
  Object.values(store||{}).forEach(arr=>(arr||[]).forEach(it=>{ it.date=normDate(it.date); }));
  return store;
}
function loadMemoStore(){ if(_cache===null) _cache=normalizeStore(_loadLocalStore()); return _cache; }

// ▼ 기존 함수 시그니처 그대로 — 캐시 기반 동기 동작
function getMemoLog(mgr,br,c){ const s=loadMemoStore(); return s[memoKey(mgr,br,c)]||[]; }
function memoCount(mgr,br,c){ return getMemoLog(mgr,br,c).length; }
function addMemoLog(mgr,br,c,date,text){
  if(!text || !text.trim()) return false;
  const s=loadMemoStore(), k=memoKey(mgr,br,c);
  if(!s[k]) s[k]=[];
  const item={date:normDate(date)||todayStr(),text:text.trim(),ts:Date.now()};
  s[k].push(item);
  _writeLocal(s);
  cloudPush('add',k,item);   // 백그라운드 전송
  return true;
}
function deleteMemoLog(mgr,br,c,ts){
  const s=loadMemoStore(), k=memoKey(mgr,br,c);
  if(s[k]){ s[k]=s[k].filter(x=>x.ts!==ts); if(!s[k].length) delete s[k]; _writeLocal(s);
    cloudPush('delete',k,{ts}); }
}
function normDate(v){
  /* 구글 시트를 거치면 날짜 셀이 Date로 자동 변환되어
     "Wed Jul 15 2026 00:00:00 GMT+0900 (한국 표준시)" 형태로 돌아온다.
     어떤 형식이 와도 YYYY-MM-DD 로 되돌린다. */
  if(v===null||v===undefined||v==='') return '';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;                 // 이미 정상
  const m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); // 2026/7/15, 2026-07-15T...
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  // "Wed Jul 15 2026 ..." (Date.toString 형식) — 표기된 날짜를 문자 그대로 읽는다.
  // new Date()로 파싱하면 표준시 변환 때문에 하루가 밀릴 수 있어 직접 추출한다.
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const t=s.match(/\b([A-Za-z]{3})\w*\s+(\d{1,2})\s+(\d{4})\b/);
  if(t && MON[t[1].toLowerCase()])
    return `${t[3]}-${String(MON[t[1].toLowerCase()]).padStart(2,'0')}-${String(t[2]).padStart(2,'0')}`;
  const d=new Date(s);
  if(isNaN(d.getTime())) return s;                              // 파싱 불가 → 원본 유지
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function eschtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ===== 클라우드(구글 시트) 동기화 ===== */
function setCloudStatus(state,msg){
  const el=document.getElementById('cloudStatus'); if(!el)return;
  const map={on:['🟢','연결됨'],off:['⚪','로컬 저장'],sync:['🔄','동기화 중…'],err:['🔴','동기화 오류']};
  const [ic,label]=map[state]||map.off;
  el.textContent=`${ic} ${msg||label}`;
  el.className='cloud-status cs-'+state;
}
// 시트 → 캐시 병합(시트 우선, 로컬 전용 항목도 보존)
function mergeStore(base,incoming){
  const out={...base};
  Object.entries(incoming||{}).forEach(([k,arr])=>{
    const cur=out[k]||[];
    const byTs={}; cur.forEach(x=>byTs[x.ts]=x); (arr||[]).forEach(x=>byTs[x.ts]=x);
    out[k]=Object.values(byTs).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.ts-b.ts);
  });
  return out;
}
async function cloudPull(){
  if(!CLOUD_URL){ setCloudStatus('off'); return; }
  setCloudStatus('sync');
  try{
    const res=await fetch(CLOUD_URL+'?action=get',{method:'GET'});
    const data=await res.json();
    _cache=normalizeStore(mergeStore(loadMemoStore(), normalizeStore(data.store||{})));
    _writeLocal(_cache);
    _cloudReady=true; setCloudStatus('on');
    if(typeof route!=='undefined' && route.view==='br') render(); // 최신 메모로 화면 갱신
  }catch(e){ _cloudReady=false; setCloudStatus('err','오프라인(로컬 저장)'); }
}
async function cloudPush(action,key,item){
  if(!CLOUD_URL){ return; }
  try{
    await fetch(CLOUD_URL,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // 프리플라이트 회피(단순요청)
      body:JSON.stringify({action,key,item})});
    if(_cloudReady) setCloudStatus('on','저장됨 ✓');
  }catch(e){ setCloudStatus('err','전송 실패(로컬 보관)'); }
}

/* ============================================================
   센터 정보(원장명·연락처·주소·개설일) 조회
   - 인증 없이 바로 조회(요청에 따라 비밀번호 절차 제거).
   ============================================================ */
async function fetchDirectorInfo(centerName){
  try{
    const res = await fetch(CLOUD_URL, {method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'getDirectorInfo', centerName})});
    const data = await res.json();
    if(!data.ok){ return {ok:false, error:data.error}; }
    return {ok:true, info:data.info};
  }catch(e){ return {ok:false, error:'서버에 연결할 수 없습니다.'}; }
}

// 사업 기간 계산: 최근개설일(명의변경일) 있으면 그 날짜 기준, 없으면 최초개설일 기준. 오늘 날짜와 비교.
function calcBizDuration(dateStr){
  if(!dateStr) return null;
  const d = new Date(normDate(dateStr)+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const now = new Date();
  let years = now.getFullYear()-d.getFullYear();
  let months = now.getMonth()-d.getMonth();
  if(now.getDate() < d.getDate()) months--;
  if(months<0){ years--; months+=12; }
  if(years<0) return {years:0, months:0, invalid:true};
  return {years, months};
}

function directorInfoHtml(centerName){
  return `<div class="dir-info">
    <div class="dir-title">🔒 센터 정보 <span id="dirRefresh" class="dir-refresh" onclick="loadDirectorInfo()">↻ 새로고침</span></div>
    <div id="dirBody" class="dir-body">불러오는 중…</div>
  </div>`;
}
// 빈 값으로 간주할 값들 (공백, 대시, "없음" 등 시트에 흔히 들어가는 표기)
function isBlankVal(v){
  if(v===null||v===undefined) return true;
  const s=String(v).trim();
  return s==='' || /^[-–—.]+$/.test(s) || s==='없음' || s.toLowerCase()==='n/a';
}
async function loadDirectorInfo(){
  if(!_modalCtx) return;
  const body = document.getElementById('dirBody');
  if(body) body.innerHTML = '불러오는 중…';
  const r = await fetchDirectorInfo(_modalCtx.c);
  if(!r.ok){
    if(body) body.innerHTML = `<span class="dir-err">${eschtml(r.error||'조회 실패')}</span>`;
    return;
  }
  const info = r.info || {};
  const hasRecent = !isBlankVal(info.최근개설일);
  const basisDate = hasRecent ? info.최근개설일 : info.최초개설일;
  const dur = isBlankVal(basisDate) ? null : calcBizDuration(basisDate);
  const durTxt = dur ? `${dur.years}년 ${dur.months}개월째 운영중` : '기간 정보 없음';
  const durBasis = hasRecent ? '최근개설일(명의변경일) 기준' : '최초개설일 기준';
  const mapUrl = info.주소 ? `https://map.naver.com/v5/search/${encodeURIComponent(info.주소)}` : null;
  const telNum = info.연락처 ? info.연락처.replace(/[^0-9+]/g,'') : null;
  if(!body) return;
  body.innerHTML = `
    <table class="dir-table">
      <tr><th>원장명</th><td>${eschtml(info.원장명||'-')}</td></tr>
      <tr><th>연락처</th><td>${info.연락처 && telNum ? `<a href="tel:${telNum}" class="dir-tel">📞 ${eschtml(info.연락처)}</a>` : eschtml(info.연락처||'-')}</td></tr>
      <tr><th>주소</th><td>${info.주소? `<a href="${mapUrl}" target="_blank" rel="noopener">${eschtml(info.주소)} <span class="dir-map">📍네이버맵</span></a>` : '-'}</td></tr>
      <tr><th>최초개설일</th><td>${eschtml(info.최초개설일||'-')}</td></tr>
      <tr><th>최근개설일<br><span class="dir-sub">(명의변경일)</span></th><td>${eschtml(info.최근개설일||'-')}</td></tr>
    </table>
    <div class="dir-duration"><b>${durTxt}</b><span class="dir-sub"> — ${durBasis}</span></div>`;
}

"윤길한>대구경북>대구본리": [{"date": "2026-07-01", "text": "윤선생을 위해 더 열심히 목표를 가지고 있어, \n좋은 태도로 사업을 하는 원장님이라 \n앞으로 계속 관심을 가지고 지도 하겠습니다.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000036}], "윤길한>대구경북>상주냉림": [{"date": "2026-07-01", "text": "법적이슈로 운영이 어려움\n[방향성] 해지 예정", "ts": 1782000000037}], "윤길한>대구경북>구미형남두산": [{"date": "2026-07-01", "text": "영어숲을 동시에 운영하고 있어서 집중하지 못하고 있음\n능력은 있는 원장님이니온라인/오프라인 홍보 지원을 통해 개선 예정\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000038}], "윤길한>대구경북>IGSE포항유강": [{"date": "2026-07-01", "text": "중등부 회원 복원으로 위해 부탁을 하였고, \n개성이 강해서 본사와 본부에서 마찰이 없도록 \n신경을 쓰는 원장입니다.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000039}], "윤길한>대구경북>숲구미도량야은": [{"date": "2026-07-01", "text": "현재 다니는 아이들도 모두 방과후를 몇개씩 하고 지역아동센터를 이용하는 아동이 다수입니다.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000040}], "윤길한>대구경북>숲경주용강": [{"date": "2026-07-01", "text": "상권에서 살아 남기 힘들어 해지를 계획하고 있음. 6월까지 버티고 해지를 고려 중 본부에서 상권 이동이나 해지를 소통하고 있음 6월까지 노력해 보기로 함.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000041}], "윤길한>대구경북>숲고령": [{"date": "2026-07-01", "text": "중. 고등에 수업이 집중되어 있어 초등 학생 모집에 소홀한 점이 있다 생각됩니다\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000042}], "윤길한>대구경북>숲대구봉무이시아": [{"date": "2026-07-01", "text": "미등록 회원에 대한 계도 진행 중\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000043}], "윤길한>대구경북>숲경주": [{"date": "2026-07-01", "text": "구도심이라 점점 학생이 줄어들기도 하고 초등학생들은 \n대형 어학원에 가고 있는것같음. \n윤선생 브랜드를 찾아오는 유림초 학부모들이 간혹 황성우영과 \n헷갈리는 경우도 있고 파이가 나눠지는듯 함\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000044}], "윤길한>대구경북>IGSE문경모전대동": [{"date": "2026-07-01", "text": "가족 문제가 있어서 지금 힘든 상태 지금 부터 다시 재기를 \n하도록 함과 온라인 줌 참석 및 본사 수학 사업 새롭게 \n도입을 희망하고 준비하고자 합니다\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000045}], "윤길한>대구경북>숲경산신대": [{"date": "2026-07-01", "text": "최근 주변 학원 신고로 많은 벌금을 내고 교육청과의 문제가 생김.  \n큰 스트레스를 받고 공항 상태로 인해 어려움을 안고 있음.  최근 윤선생에 대한 불만족이 많은 상태이지만, 계속 이어가기 위해 노력하고 있음.  앞으로 학원의 상황이 좋아지면 다시 열심히 하려고 함.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000046}], "윤길한>대구경북>IGSE포항동해": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 문제 강화", "ts": 1782000000047}], "윤길한>대구경북>IGSE칠곡남율": [{"date": "2026-07-01", "text": "적극적인 원장님이며, 우영도 하나 운영하고 있음.  학군.\n[방향성] 영업/홍보 독려", "ts": 1782000000118}], "황성연>경기하남>미사19단지": [{"date": "2026-07-01", "text": "지난달에 공동홍보를 하기로 했다가 못했음. 건강상태가 안좋아서 중앙병원을 일주일에 2번씩 다니고 계심( 통증이 안잡혀서 )\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000119}], "황성연>경기하남>위례포레자이": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000120}], "황성연>경기하남>하남꿈동산신안": [{"date": "2026-07-01", "text": "교산신도시 입주 예정\n[방향성] 홍보 강화 / 이전 고려", "ts": 1782000000121}], "황성연>대전>IGSE유성장대": [{"date": "2026-07-01", "text": "3월말 회원 24명 됨.", "ts": 1782000000122}], "황성연>용인수지>한숲시티5블럭": [{"date": "2026-07-01", "text": "관리교사 출신. 언더가 조금 있는듯. 초등회원이 없음. 학교앞에 가기 싫다고\n[방향성] 영업/홍보 독려", "ts": 1782000000123}], "황성연>용인수지>성복엘지빌리지": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000124}], "황성연>용인수지>서천휴먼시아1단지": [{"date": "2026-07-01", "text": "건강상의 이슈로 운영이 어려운 상황. 남편이 영어숲을 했음. 지금은 안하는 것 같음. 별거 중? 여동생이랑 지내다가 지금은 따로 삼. 몸이 안좋아서 0명이었던 적이 있음.(회원을 돌려보냈다고,...)\n[방향성] 영업/홍보 독려", "ts": 1782000000125}], "황성연>용인수지>신흥역하늘채랜더스원": [{"date": "2026-07-01", "text": "위례에서 공부방하시던 분. 성남 공부방을 하다가 허가를 못받아서 쫓겨나듯 교습소를 차리게 됨. 인테리어 할 때 주민 신고로 오픈도 제대로 못했던 거점. 무료 파닉스 수업으로 5명 모집하시고 홍보도 열심히 하심.\n[방향성] 영업/홍보 독려", "ts": 1782000000126}], "황성연>전남광주>완도노화": [{"date": "2026-07-01", "text": "완도 섬 지역이라 특수한 상황.\n[방향성] 영업/홍보 독려", "ts": 1782000000127}], "황성연>전남광주>강진마량": [{"date": "2026-07-01", "text": "강진읍에서도 꽤 깊은 곳에 있음. 연락이 잘 안되고 만나기도 쉽지 않음. 본사납입금도 가장 늦게 냄.(초등 전교생 31명)\n[방향성] 영업/홍보 독려", "ts": 1782000000128}], "황성연>전남광주>광주서초": [{"date": "2026-07-01", "text": "영어 보조선생이 그만둠.\n[방향성] 영업/홍보 독려", "ts": 1782000000129}], "황성연>전남광주>일곡청솔2차": [{"date": "2026-07-01", "text": "작년에 친오빠가 급작스럽게 사망하면서 홀어머이를 모시고 있음. 정신적 충격이 있어서 어려움이 있는 상황.\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000130}], "황성연>전남광주>숲광주계림": [{"date": "2026-07-01", "text": "60대 후반의 원장. 공간도 큰데 그냥저냥 하신다고. 부부끼리 함. 입지가 지금 구도심이 되어서 학생들이 줄어듬. 옮기는 것도 제안했는데 움직임이 없음.\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000131}], "황성연>전남광주>숲광주치평남": [{"date": "2026-07-01", "text": "1세대 영어숲 60대 후반의 원장. 명의변경 문의함.(그만하고 싶다고) 딸이랑 같이 하고 있음.\n[방향성] 명의변경", "ts": 1782000000132}], "황성연>전남광주>숲광주학운": [{"date": "2026-07-01", "text": "70평. 나이는 많지 않지만 방문을 꺼려함. 학생수가 적은 상권. 여러 번 이벤트 해보자고 권유 했는데 아직 움직임은 없음.(초등300명대-고립상권)\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000133}], "황성연>전남광주>숲목포신옥암": [{"date": "2026-07-01", "text": "유료이벤트를 진행해서 회원 모집이 조금 됨. 언더회원이 있던 것 같아서 관리 중. 권리금 받고 인수인계할 의사가 있음. 위치가 괜찮음.\n[방향성] 명의변경", "ts": 1782000000134}], "황성연>전남광주>숲구례": [{"date": "2026-07-01", "text": "1세대 영어숲. 조그만한 상권이라 10명 유지하는 것도 감지덕지함.\n[방향성] 영업/홍보 독려", "ts": 1782000000135}], "황성연>전남광주>IGSE광양마동": [{"date": "2026-07-01", "text": "젋은 원장. 작년 20명이었는데 인수하자마자 회원을 빼기 시작. 초등은 다 올려줘라 했더니 난리를 침…\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000136}], "황성연>전남광주>숲광주신용": [{"date": "2026-07-01", "text": "교실 김남식 사장 사위. 아내(교실문흥)랑 같이 하는 듯.(초등 1000명학교 2개)\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000137}], "황성연>전남광주>숲장흥": [{"date": "2026-07-01", "text": "학원을 혼자하는데 0명이었다가 1명이었다가 계속 왔다갔다함.\n교실회원을 올렸다 내렸다 하는 느낌임.(초등600명대)\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000138}], "황성연>전남광주>숲광주백운남": [{"date": "2026-07-01", "text": "본인 학원…영어선생님이 그만두심. 작년말부터 명의변경하려고 알아봄.\n[방향성] 명의변경", "ts": 1782000000139}], "황성연>전남광주>숲광주신가": [{"date": "2026-07-01", "text": "교실이랑 같이함. 원장 혼자함. 교실1세대라 친한사이. 마음은 떠있는 상황으로 언제든 해지 대상.\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000140}], "황성연>전남광주>숲광주일곡": [{"date": "2026-07-01", "text": "100평대 학원. 아내랑 같이함. 젊은 원장인데 2달전에 연락와서 몸이 아파 출근을 못하고 있음.\n[방향성] 영업/홍보 독려", "ts": 1782000000141}], "황성연>전남광주>숲광주상무": [{"date": "2026-07-01", "text": "인수인계하려고 알아보심.\n[방향성] 명의변경", "ts": 1782000000142}], "황성연>전남광주>숲광주수완장덕": [{"date": "2026-07-01", "text": "구) 임혜정본부장 학원 인수받음. 동력을 조금 잃은 느낌. 게릴라현수막, 이벤트, 학교앞 영업도 신청안함.\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000143}], "황성연>전남광주>숲남악오룡": [{"date": "2026-07-01", "text": "태권도 학원도 운영 중(멀리). 희망초가 9월에 오픈하면 회원모집이 더 잘될 것으로 기대(학원 앞에 생김)\n[방향성] 영업/홍보 독려\n[기타] 올해 신설", "ts": 1782000000144}], "황성연>전남광주>IGSE무안남악": [{"date": "2026-07-01", "text": "찾아가려고 해도 오지말라고~ 과금이야기. 내려주는거 아니면 뭐더러 오냐고 함.(초등 900)\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000145}], "황성연>전남광주>IGSE금호화개": [{"date": "2026-07-01", "text": "인수인계문의함. 딸앞으로 명의를 바꿀지 권리금을 받고 팔지\n[방향성] 명의변경", "ts": 1782000000146}], "황성연>전남순천>여수죽림부영": [{"date": "2026-07-01", "text": "해지", "ts": 1782000000147}], "황성연>전남순천>숲순천연향": [{"date": "2026-07-01", "text": "아이들에게 열심히 잘 하는 원장님인데, 회원 모집이 잘 안되서 안따깝다", "ts": 1782000000148}], "황성연>전남순천>숲여수여서": [{"date": "2026-07-01", "text": "작년에도 재계약을 머뭇거리다가 고민이 많으셨던 원장님\n여수죽림부영 공부방 원장이 알바로 일하고 있음.", "ts": 1782000000149}], "황성연>전북>익산모현부영": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000150}], "황성연>전북>오수": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000151}], "황성연>전북>진안대성": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000152}], "황성연>전북>서신롯데": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000153}], "황성연>전북>평화경복궁": [{"date": "2026-07-01", "text": "[방향성] 해지 고려", "ts": 1782000000154}], "황성연>전북>서신샛별": [{"date": "2026-07-01", "text": "[방향성] 해지 고려", "ts": 1782000000155}], "황성연>전북>익산어양": [{"date": "2026-07-01", "text": "[방향성] 해지 고려", "ts": 1782000000156}], "황성연>전북>순창이루리학원": [{"date": "2026-07-01", "text": "종합학원 스타일\n[방향성] 영업/홍보 독려", "ts": 1782000000157}], "황성연>전북>부송제일": [{"date": "2026-07-01", "text": "방문교사 출신. 교실에 중점을 두고 계심. 마인드 전환이 필요함.\n[방향성] 해지 고려", "ts": 1782000000158}], "황성연>전북>숲익산": [{"date": "2026-07-01", "text": "해지\n---\n중등은 등록안하고 일반 내신교재로 수업. 전체적으로 상권이 분산되어 있어 추후 인수인계를 하거나 자리를 옮기는게 필요\n[방향성] 명의변경 / 해지 고려", "ts": 1782000000159}], "황성연>전북>IGSE익산어양": [{"date": "2026-07-01", "text": "나이가 있으신데, 본인이 수업하고 와이프가 수학(개인)을 함. 학부모설명회는 가끔하시는데, 온라인 홍보는 안하심. 모현현대 원장의 형임.\n[방향성] 영업/홍보 독려", "ts": 1782000000160}], "황성연>전북>숲군산미장": [{"date": "2026-07-01", "text": "고학년들은 개인수업을 하는 것 같음. 큰 문제없이 계속 하실 것 같은 원장.\n[방향성] 영업/홍보 독려", "ts": 1782000000161}], "황성연>전북>숲전주삼천남": [{"date": "2026-07-01", "text": "[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000162}], "황성연>전북>IGSE효자효문": [{"date": "2026-07-01", "text": "구도심. 전주서부와 반반 나눠서 상권을 나눠 가진 학원\n[방향성] 영업/홍보 독려", "ts": 1782000000163}], "황성연>전북>숲전주혁신교습소": [{"date": "2026-07-01", "text": "엄청 네거티브한 원장이라 본 function seedMemosOnce(){
  try{
    const store=loadMemoStore();
    let changed=false; const newItems=[];
    Object.entries(SEED_MEMOS).forEach(([k,arr])=>{
      const existing=store[k]||[];
      arr.forEach(seedItem=>{
        if(!existing.some(e=>e.ts===seedItem.ts)){ existing.push({...seedItem}); newItems.push([k,seedItem]); changed=true; }
      });
      if(existing.length) store[k]=existing;
    });
    if(changed){ _writeLocal(store);
      // 시트에도 시드 반영(중복 방지 로직은 서버에서 ts로 처리)
      if(CLOUD_URL) newItems.forEach(([k,it])=>cloudPush('add',k,it));
    }
  }catch(e){ /* localStorage 불가 환경은 폴백 사용 */ }
}
seedMemosOnce();

   - 메모(날짜/내용) 기반. 민감 내용은 규칙으로 요약 대체.

// 민감 정보 → 요약 대체 (원문은 대시보드 메모에만 남김)
// 주의: 단어 하나만으로 마스킹하면 업무 내용까지 가려진다.
//       (예: "아내(교실문흥)랑 같이 운영" → 가족 사정 아님)
//       → 질병·사고 '맥락'이 함께 있을 때만 마스킹한다.
const HARDSHIP = '(아프|아팠|병환|병원|입원|수술|치료|간병|투병|암|항암|사망|별세|장례|위독|진단|힘들|어려움|충격)';
const SENSITIVE_RULES = [
  {re:/(폭언|인권침해|고소|소송|법적\s*분쟁)/,               sum:'고객 클레임·분쟁 이슈 발생'},
  {re:/(암\s|암진단|항암|투병|수술|입원|이석증|대상포진|위독)/, sum:'원장 개인 건강 사유로 운영에 차질'},
  {re:/(건강상|건강\s*문제|건강\s*이슈|건강이\s*안|건강\s*악화)/, sum:'원장 개인 건강 사유로 운영에 차질'},
  {re:/(임신|출산|산후)/,                                  sum:'원장 개인 가정 사유(출산·육아 등)'},
  {re:new RegExp('(남편|아내|친정|시댁|아버지|어머니|오빠|자녀|가족).{0,25}'+HARDSHIP), sum:'가족 사정으로 운영에 영향'},
  {re:new RegExp(HARDSHIP+'.{0,25}(남편|아내|친정|시댁|아버지|어머니|오빠|자녀|가족)'), sum:'가족 사정으로 운영에 영향'},
  {re:/(이혼|우울증|정신적\s*충격)/,                        sum:'원장 개인 사정 발생'},
];
function sanitize(text){
  for(const r of SENSITIVE_RULES){
    if(r.re.test(text)) return {text:r.sum, masked:true};
  }
  return {text, masked:false};
}

// 조치 키워드 태깅 (숫자가 작을수록 시급)
// '해지'가 본문 어딘가에 스치듯 나오는 것만으로 태깅하면 과다 검출된다.

const ACTION_RULES = [

  {tag:'인수인계', lv:2, re:/(인수인계|인수자|인계자|인수\s*(예정|희망|의사|검토)|명의\s*변경\s*(예정|진행|희망|검토)|양도\s*(예정|희망))/},
  {tag:'휴원',     lv:2, re:/(휴원|휴업|운영\s*정지)/},
  {tag:'부진',     lv:3, re:/(저실적\s*거점|회원\s*(감소|이탈)|신규\s*(회원)?\s*(가\s*)?없|유입.{0,6}없|경영\s*악화)/},
  {tag:'이전',     lv:3, re:/(이전\s*(예정|검토|고려|계획)|이사\s*(예정|계획)|거점\s*이전)/},
];
function tagAction(text){
  const hits=[];
  for(const r of ACTION_RULES) if(r.re.test(text)) hits.push(r);
  if(!hits.length) return null;
  return hits.sort((a,b)=>a.lv-b.lv)[0];
}

// 주간 범위 (월~일)
function weekRange(baseISO){
  const d = baseISO ? new Date(baseISO+'T00:00:00') : new Date();
  const dow = (d.getDay()+6)%7;                 // 월=0
  const mon = new Date(d); mon.setDate(d.getDate()-dow);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const f = x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  return {from:f(mon), to:f(sun)};
}

// 해당 매니저 · 기간의 메모 수집
function collectMemos(mgrName, from, to){
  const store = loadMemoStore();
  const out = [];
  Object.entries(store).forEach(([key, arr])=>{
    const [mgr, br, center] = key.split('>');
    if(mgr !== mgrName) return;
    (arr||[]).forEach(it=>{
      const d = normDate(it.date);
      if(!d || d < from || d > to) return;
      const s = sanitize(it.text);
      out.push({br, center, date:d, raw:it.text, text:s.text,
                masked:s.masked, action:tagAction(it.text)});
    });
  });
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.br.localeCompare(b.br));
}

// 리포트 데이터 조립
function buildWeekly(mgrIdx, from, to){
  const m = DATA.managers[mgrIdx];
  const memos = collectMemos(m.name, from, to);
  const branchMemos = memos.filter(x=>x.center===BRANCH_MEMO_KEY);
  const centerMemos = memos.filter(x=>x.center!==BRANCH_MEMO_KEY);

  // 담당 규모 · 위험 현황 (기존 분석 함수 재사용)
  let nC=0, risk=0, low=0, scoreSum=0, nB=0;
  m.branches.forEach(b=>{
    nC += b.centers.length;
    b.centers.forEach(c=>{ if(riskLevel(c).k==='red') risk++; if(isLowCenter(c)) low++; });
    if(!b.placeholder){ scoreSum += healthMetrics(b).score; nB++; }
  });
  const avg = nB ? Math.round(scoreSum/nB) : 0;

  // 즉시 조치 (액션 태그 있는 메모 → 시급도순)
  const actions = centerMemos.filter(x=>x.action)
    .sort((a,b)=> a.action.lv-b.action.lv || a.date.localeCompare(b.date));

  // 본부별 그룹
  const byBr = {};
  centerMemos.forEach(x=>{ (byBr[x.br] = byBr[x.br]||[]).push(x); });

  return {mgr:m.name, from, to, memos, branchMemos, centerMemos, actions, byBr,
          stat:{nBranch:m.branches.length, nCenter:nC, risk, low, avg,
                nMemo:memos.length, nMasked:memos.filter(x=>x.masked).length}};
}

let _brMemoCtx=null;
function initBranchMemo(mgrName,brName){ _brMemoCtx={mgr:mgrName,br:brName}; renderBranchMemoLog(); }

function memValid(c){ return c.mem.filter(v=>v!==null&&v!==undefined); }
// 첫→마지막 관측 증감
function memTrend(c){
  const v=memValid(c);
  if(v.length<2) return {first:v[0]??null,last:v[0]??null,diff:0,pct:0};
  const first=v[0],last=v[v.length-1],diff=last-first;
  return {first,last,diff,pct:first?Math.round(diff/first*100):0};
}
// 최근 추세(마지막 2개월)
function recentDrop(c){
  const v=memValid(c);
  if(v.length<2) return 0;
  return v[v.length-1]-v[v.length-2];
}
// 스파크라인 (▁▂▃▄▅▆▇)
function sparkline(mem){
  const blocks='▁▂▃▄▅▆▇';
  const vals=mem.map(v=>(v===null||v===undefined)?null:v);
  const nums=vals.filter(v=>v!==null);
  if(!nums.length) return '─────';
  const mn=Math.min(...nums),mx=Math.max(...nums),rng=mx-mn||1;
  return vals.map(v=>v===null?' ':blocks[Math.round((v-mn)/rng*(blocks.length-1))]).join('');
}
// 센터 위험도: 회원감소·저실적·면담공백·최근하락 종합
function riskLevel(c){
  const t=memTrend(c), low=isLowCenter(c), noMng=c.mng.months.length===0, rec=recentDrop(c);
  let score=0;
  if(t.diff<0) score+=2;
  if(t.pct<=-30) score+=1;
  if(low) score+=2;
  if(noMng) score+=1;
  if(rec<0) score+=1;
  if(score>=5) return {k:'red',t:'🔴 위험'};
  if(score>=3) return {k:'yel',t:'🟡 주의'};
  return {k:'grn',t:'🟢 양호'};
}
// 관리 우선순위: 1 감소+미면담 / 2 저실적 / 3 감소 / 4 관리중
function priorityTier(c){
  const t=memTrend(c), low=isLowCenter(c), noMng=c.mng.months.length===0;
  if(t.diff<0 && noMng) return 1;
  if(low) return 2;
  if(t.diff<0) return 3;
  return 4;
}
// Track2 정렬 모드 (본부별 키로 상태 유지)
let _t2SortMode = {};
const T2_BM_ORDER = {'학원(숲)':0, '학원(IGSE)':1, '학원(상가형)':2, '교습소':3, '공부방':4};
function t2Key(brName){ return brName.replace(/[^a-zA-Z0-9가-힣]/g,''); }
function t2SortComparator(mode){
  if(mode==='mem_desc') return (a,b)=> (b.c.mem[7]??-Infinity) - (a.c.mem[7]??-Infinity);
  if(mode==='mem_asc')  return (a,b)=> (a.c.mem[7]??Infinity) - (b.c.mem[7]??Infinity);
  if(mode==='bm') return (a,b)=> (T2_BM_ORDER[a.c.form]??9)-(T2_BM_ORDER[b.c.form]??9) || a.tier-b.tier;
  return (a,b)=> a.tier-b.tier || b.u-a.u; // priority(기본)
}
function t2FilterBarHtml(brName){
  const key = t2Key(brName);
  const mode = _t2SortMode[key] || 'priority';
  const opts = [['priority','우선순위'],['mem_desc','실회원 많은순'],['mem_asc','실회원 적은순'],['bm','BM별(숲→IGSE→상가형→교습소→공부방)']];
  return `<div class="t2-filter-bar">
    <label>정렬</label>
    <select onchange="changeT2Sort('${key}', this.value)">
      ${opts.map(([v,l])=>`<option value="${v}" ${mode===v?'selected':''}>${l}</option>`).join('')}
    </select>
  </div>`;
}
function changeT2Sort(key, mode){
  _t2SortMode[key] = mode;
  const tbody = document.getElementById('t2body-'+key);
  if(tbody && typeof route!=='undefined' && route.view==='br'){

}
// Track2 행 생성(정렬 모드 반영) — 초기 렌더와 필터 변경 시 재사용
function buildTrack2Rows(m, b, mgrIdx, brIdx){
  const mode = _t2SortMode[t2Key(b.name)] || 'priority';
  const ordered = b.centers.map((c,idx)=>({c,idx,tier:priorityTier(c),u:urgencyScore(c)}))
    .sort(t2SortComparator(mode));
  return ordered.map(({c,idx})=>{
    const low = isLowCenter(c);
    const cells = MONTH_LABELS.map((_,i)=>{
      const v = c.mem[i]; const flag = isLowMonth(c,i);
      return `<td class="num ${flag?'warn':''}">${v===null?'-':v}${flag?' 🚨':''}</td>`;
    }).join('');
    // 면담 히트맵: 공식 면담 기록(mng.months) + 센터 메모가 남겨진 월도 함께 반영
    const memoMonths = new Set();
    getMemoLog(m.name, b.name, c.name).forEach(x=>{
      const d = normDate(x.date);
      if(d && d.slice(0,4) === '2026'){ memoMonths.add(parseInt(d.slice(5,7),10)); }
    });
    const heat = `<span class="heat">${MONTH_LABELS.map((_,i)=>{
      const mon=i+1;
      const hasInterview=c.mng.months.includes(mon);
      const hasMemo=memoMonths.has(mon);
      const on = hasInterview || hasMemo;
      const label = hasInterview && hasMemo ? '면담+메모' : hasInterview ? '면담' : hasMemo ? '메모' : '미면담';
      return `<span class="${on?'on':'off'}" title="${mon}월 ${label}"></span>`;
    }).join('')}</span>`;
    const t=memTrend(c);
    const trendTxt = `${t.first??'-'}→${t.last??'-'} <b class="${t.diff>0?'delta-up':t.diff<0?'delta-down':'delta-flat'}">${t.diff>0?'+':''}${t.diff}</b>`;
    const risk=riskLevel(c);
    const tier=priorityTier(c);
    const prioLabel={1:'1순위',2:'2순위',3:'3순위',4:'4순위'}[tier];
    const mc=memoCount(m.name,b.name,c.name);
    return `<tr class="${low?'low-row':''}">
      <td><span class="prio-tag prio-${tier}">${prioLabel}</span></td>
      <td><a class="center-link" onclick="openCenterDetail(${mgrIdx},${brIdx},${idx})">${c.name}<span class="memo-badge" id="memobadge-${idx}">${mc?`📝${mc}`:''}</span></a></td>
      <td class="num">${c.form}</td>${cells}
      <td class="num">${heat}</td>
      <td class="num trend-cell">${trendTxt}</td>
      <td class="num risk-dot risk-${risk.k}">${risk.t}</td></tr>`;
  }).join('');
}
// 면담 TOP5 점수 (높을수록 시급)
function urgencyScore(c){
  const t=memTrend(c), rec=recentDrop(c), noMng=c.mng.months.length===0;
  let s=0;
  s += Math.max(0,-t.diff)*3;              // 감소폭
  s += Math.max(0,-t.pct);                  // 감소율
  if(isLowCenter(c)) s+=15;                 // 저실적
  if(noMng) s+=12;                          // 면담 공백
  if(rec<0) s+= -rec*2;                     // 최근 하락 가속
  const v=memValid(c);
  if(v.length && v[0]===0 && t.diff>=0 && t.last<=threshold(c.form)) s+=8; // 신설 정체
  return s;
}
function topInterviewCenters(b,n){
  return b.centers.map(c=>({c,s:urgencyScore(c)}))
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.c);
}
// 본부 KPI 합계 + 전월(마지막-직전월) 증감
function kpiTotals(b){
  const sum=k=>b.track1.reduce((s,r)=>s+(+r[k]||0),0);
  const delta=k=>{const t=b.track1; if(t.length<2)return 0; return (+t[t.length-1][k]||0)-(+t[t.length-2][k]||0);};
  return {
    면담:{v:sum('면담'),d:delta('면담')},
    모임:{v:sum('모임'),d:delta('모임')},
    영업:{v:sum('영업'),d:delta('영업')},
    개설:{v:sum('개설'),d:delta('개설')}
  };
}
// 본부 건강도 5축(0~100) + 종합점수
function healthMetrics(b){
  const n=b.centers.length||1;
  const mngd=b.centers.filter(c=>c.mng.months.length>0).length;
  const 관리율=mngd/n*100;
  const 면담총=b.track1.reduce((s,r)=>s+(+r.면담||0),0);
  const 면담율=Math.min(100, 면담총/n*100);
  const inc=b.centers.filter(c=>memTrend(c).diff>0).length;
  const dec=b.centers.filter(c=>memTrend(c).diff<0).length;
  const 회원증감=Math.round(((inc-dec)/n+1)/2*100); // -전부감소0 ~ +전부증가100
  const 영업총=b.track1.reduce((s,r)=>s+(+r.영업||0),0);
  const 영업활동=Math.min(100, 영업총*4);
  const 개설총=b.track1.reduce((s,r)=>s+(+r.개설||0),0);
  const 개설활동=Math.min(100, 개설총*20);
  const axes={관리율,면담율,회원증감,영업활동,개설활동};
  const score=Math.round((관리율*0.3+면담율*0.2+회원증감*0.2+영업활동*0.15+개설활동*0.15));
  const grade= score>=70?{k:'good',t:'🟢 양호'}: score>=45?{k:'warn',t:'🟡 보통'}:{k:'risk',t:'🔴 취약'};
  return {axes,score,grade,관리율,면담율,회원증감,inc,dec,mngd,n};
}
// SWOT 규칙 기반
function buildSWOT(b){
  const h=healthMetrics(b);
  const lowN=b.centers.filter(isLowCenter).length;
  const noMngN=b.centers.filter(c=>c.mng.months.length===0).length;
  const igse=b.centers.filter(c=>c.form==='학원(IGSE)');
  const igseNoMng=igse.filter(c=>c.mng.months.length===0).length;
  const 개설총=b.track1.reduce((s,r)=>s+(+r.개설||0),0);
  const 영업총=b.track1.reduce((s,r)=>s+(+r.영업||0),0);
  const S=[],W=[],O=[],T=[];
  if(h.관리율>=60) S.push('관리 커버리지 우수('+h.관리율.toFixed(0)+'%)');
  if(영업총>=15) S.push('영업활동 활발(누적 '+영업총+'건)');
  if(h.inc>h.dec) S.push('회원 증가 센터 다수('+h.inc+'개)');
  if(b.centers.some(c=>c.mng.months.length>=3)) S.push('정기·집중관리 센터 확보');
  if(!S.length) S.push('5개월 활동보고서 제출로 추적 기반 확보');
  if(h.면담율<40) W.push('센터 면담율 낮음('+h.면담율.toFixed(0)+'%)');
  if(igse.length&&igseNoMng/igse.length>=0.5) W.push('IGSE 관리 부족('+igseNoMng+'/'+igse.length+' 미관리)');
  if(noMngN>b.centers.length*0.5) W.push('미면담 센터 과다('+noMngN+'개)');
  if(lowN>0) W.push('저실적 센터 '+lowN+'개 상존');
  if(!W.length) W.push('특이 약점 없음 — 현 수준 유지');
  if(개설총>=5) O.push('개설상담 지속(누적 '+개설총+'건) → 신규 파이프라인');
  if(b.centers.some(c=>{const v=memValid(c);return v.length&&v[0]===0&&memTrend(c).diff>0;})) O.push('신설 센터 회원 상승 반전 여지');
  if(h.inc>0) O.push('증가세 센터 성공사례 수평전개 가능');
  if(!O.length) O.push('저활동 지역 신규 영업 여지');
  if(lowN>=b.centers.length*0.3) T.push('저실적 센터 비중 높음('+lowN+'/'+b.centers.length+')');
  if(h.dec>h.inc) T.push('회원 감소 센터 우위('+h.dec+'개)');
  if(b.centers.some(c=>memTrend(c).pct<=-40)) T.push('급감(-40%↑) 센터 존재 — 이탈 위험');
  if(!T.length) T.push('단기 위협 요인 낮음');
  return {S,W,O,T};
}
// 면담 가이드(질문+액션)
function buildGuide(b){

// Executive Summary 문장 자동 생성
function buildExecSummary(b){
  const h=healthMetrics(b);
  const lowN=b.centers.filter(isLowCenter).length;
  const decN=b.centers.filter(c=>memTrend(c).diff<0).length;
  const noMngN=b.centers.filter(c=>c.mng.months.length===0).length;
  const igse=b.centers.filter(c=>c.form==='학원(IGSE)');
  const igseNoMng=igse.filter(c=>c.mng.months.length===0).length;
  const 영업총=b.track1.reduce((s,r)=>s+(+r.영업||0),0);
  const 면담총=b.track1.reduce((s,r)=>s+(+r.면담||0),0);
  const parts=[];
  // 활동 대비 관리
  if(영업총>=10 && h.면담율<40)
    parts.push(`<b>${b.name}</b> 본부는 영업활동(누적 ${영업총}건)은 활발하지만 <b>센터 면담 커버리지가 낮습니다</b>(관리율 ${h.관리율.toFixed(0)}%).`);
  else if(면담총>=10 && h.관리율>=50)
    parts.push(`<b>${b.name}</b> 본부는 면담·관리가 비교적 촘촘히 이뤄지고 있습니다(관리율 ${h.관리율.toFixed(0)}%).`);
  else
    parts.push(`<b>${b.name}</b> 본부는 전반적으로 현장 활동량이 제한적이며 관리율은 ${h.관리율.toFixed(0)}%입니다.`);
  if(decN>0) parts.push(`회원 감소 센터는 <b>${decN}개</b>${lowN?`, 저실적 센터는 <b>${lowN}개</b>`:''}입니다.`);
  else if(lowN>0) parts.push(`저실적 센터가 <b>${lowN}개</b> 확인됩니다.`);
  if(igse.length&&igseNoMng/igse.length>=0.5) parts.push(`특히 <b>IGSE 관리가 부족</b>합니다(${igseNoMng}/${igse.length} 미관리).`);
  // 다음 액션
  const acts=[];
  if(lowN>0) acts.push('저실적 센터 방문');
  if(b.centers.some(c=>{const v=memValid(c);return v.length&&v[0]===0;})) acts.push('신설 센터 지원');
  if(noMngN>0) acts.push('미면담 센터 접촉');
  if(!acts.length) acts.push('우수 센터 사례 확산');
  parts.push(`다음 달에는 <b>${acts.join('</b>, <b>')}</b>을(를) 우선 추진하는 것이 좋습니다.`);
  return parts.join(' ');
}

const app = document.getElementById('app');

function parseHash(){
  const h = (location.hash || '#home').slice(1);
  if(h==='home' || h==='') return {view:'home'};
  const mHomeSec = h.match(/^home:(mem|engrev|new|curi)$/);
  if(mHomeSec) return {view:'home', scrollTo:mHomeSec[1]};
  const mHq = h.match(/^hq:(eng|curi)$/);
  if(mHq) return {view:'hq', section:mHq[1]};
  const mHqCuri = h.match(/^hqcuri:([^/]+)\/(.+)$/);
  if(mHqCuri) return {view:'hqcuri', mgr:decodeURIComponent(mHqCuri[1]), region:decodeURIComponent(mHqCuri[2])};
  if(h==='allcenters') return {view:'allcenters'};
  const mAllList = h.match(/^allcenters:(eng|math)$/);
  if(mAllList) return {view:'allcenterslist', brand:mAllList[1]};
  const mDoc = h.match(/^doc:(.+)$/);
  if(mDoc){
    const id = decodeURIComponent(mDoc[1]);
    if(DOC_LINKS.some(d=>d.id===id)) return {view:'doc', doc:id};
  }
  const mVoc = h.match(/^voc:(.+)$/);
  if(mVoc){
    const mi = DATA.managers.findIndex(m=>m.name===decodeURIComponent(mVoc[1]));
    if(mi>=0) return {view:'voc', mgr:mi};
  }
  const mMgr = h.match(/^mgr:([^/]+)$/);
  if(mMgr){
    const mi = DATA.managers.findIndex(m=>m.name===decodeURIComponent(mMgr[1]));
    if(mi>=0) return {view:'mgr', mgr:mi, br:null};
  }
  const mBr = h.match(/^mgr:([^/]+)\/br:(.+)$/);
  if(mBr){
    const mi = DATA.managers.findIndex(m=>m.name===decodeURIComponent(mBr[1]));
    if(mi>=0){
      const bi = DATA.managers[mi].branches.findIndex(b=>b.name===decodeURIComponent(mBr[2]));
      if(bi>=0) return {view:'br', mgr:mi, br:bi};
    }
  }
  return {view:'home'};
}
function stringifyRoute(r){
  if(r.view==='home') return r.scrollTo ? `home:${r.scrollTo}` : 'home';
  if(r.view==='hq') return `hq:${r.section}`;
  if(r.view==='hqcuri') return `hqcuri:${encodeURIComponent(r.mgr)}/${encodeURIComponent(r.region)}`;
  if(r.view==='allcenters') return 'allcenters';
  if(r.view==='allcenterslist') return `allcenters:${r.brand}`;
  if(r.view==='doc') return `doc:${encodeURIComponent(r.doc)}`;
  if(r.view==='voc') return `voc:${encodeURIComponent(DATA.managers[r.mgr].name)}`;
  if(r.view==='mgr') return `mgr:${encodeURIComponent(DATA.managers[r.mgr].name)}`;
  if(r.view==='br') return `mgr:${encodeURIComponent(DATA.managers[r.mgr].name)}/br:${encodeURIComponent(DATA.managers[r.mgr].branches[r.br].name)}`;
}
let route = parseHash();

function go(r){
  if(typeof closeCenterDetail==='function')closeCenterDetail();
  const hash = '#'+stringifyRoute(r);
  if(location.hash===hash){ route=r; render(); window.scrollTo(0,0); }
  else location.hash = hash;   // hashchange 리스너가 render() 호출 → 히스토리 자동 적재
}

function menuItemRoute(id){
  // 하위메뉴 id → go() 라우트로 변환 (홈 섹션/매니저/본사직영/VOC/문서 모두 지원)
  if(id.startsWith('home:')) return {view:'home', scrollTo:id.slice(5)};
  if(id.startsWith('hq:')) return {view:'hq', section:id.slice(3)};
  if(id.startsWith('mgr:')){
    const name = id.slice(4);
    return {view:'mgr', mgr:DATA.managers.findIndex(m=>m.name===name)};
  }
  if(id.startsWith('voc:')){
    const name = id.slice(4);
    return {view:'voc', mgr:DATA.managers.findIndex(m=>m.name===name)};
  }
  if(id.startsWith('doc:')) return {view:'doc', doc:id.slice(4)};
  return {view:'home'};
}
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  const activeMgrName = (route.view==='mgr'||route.view==='br') ? DATA.managers[route.mgr].name : null;
  const activeVocName = route.view==='voc' ? DATA.managers[route.mgr].name : null;
  let html = `<div class="sb-brand">가맹본부 통합 보드</div>`;
  MENU.forEach(item=>{
    if(item.type==='single'){
      const active = route.view===item.id ? 'active' : '';
      html += `<div class="menu-item ${active}" onclick="go({view:'${item.id}'})">${item.label}</div>`;
    } else {
      const kids = item.children();
      const exp = _sbExpanded[item.id];
      const headerActive = item.navigable && route.view===item.id && !route.scrollTo ? 'active' : '';
      const headerClick = item.navigable
        ? `navigableGroupClicked('${item.id}', {view:'${item.id}'})`
        : `toggleMenuGroup('${item.id}')`;
      html += `<div class="menu-item ${exp?'expanded':''} ${headerActive}" onclick="${headerClick}">${item.label}<span class="chev">›</span></div>`;
      html += `<div class="submenu" style="max-height:${exp? (kids.length*34+10)+'px':'0'}">`;
      kids.forEach(k=>{
        const isActive = k.id.startsWith('home:') ? (route.view==='home' && route.scrollTo===k.id.slice(5))
                        : k.id.startsWith('hq:') ? (route.view==='hq' && route.section===k.id.slice(3))
                        : k.id.startsWith('mgr:') ? (activeMgrName===k.id.slice(4))
                        : k.id.startsWith('voc:') ? (activeVocName===k.id.slice(4))
                        : k.id.startsWith('doc:') ? (route.view==='doc' && route.doc===k.id.slice(4))

function fmtWon(v){
  if(v===null||v===undefined) return '-';

}

function bmCategory(form){
  if(form==='학원(숲)') return '숲';
  if(form==='학원(IGSE)') return 'IGSE';
  return '우영'; // 학원(상가형)·교습소·공부방

function bmMemberSeries(){
  const cats = {'전체':new Array(8).fill(0), '숲':new Array(8).fill(0), 'IGSE':new Array(8).fill(0), '우영':new Array(8).fill(0)};
  DATA.managers.forEach(m=>m.branches.forEach(b=>b.centers.forEach(c=>{

/* ===== 드릴다운 공통 유틸 (전국 → 매니저 → 본부/HQ하위그룹) =====
   scope.mgr : null(전국) | 매니저명 | 'HQ'(본사·큐리매쓰 전용, 실회원 대시보드에서만 의미있음)
   scope.br  : null/'합산' | 본부명 (또는 HQ일 때 본사 하위그룹명) */
function curiSubGroups(){
  const set = new Set(); CURI_DATA.forEach(r=>{ if(r.mgr==='본사' && r.sub) set.add(r.sub); });
  return Array.from(set);
}
function scopeBranchOptions(mgrName, forCuri){
  if(mgrName===null) return [];
  if(mgrName==='HQ') return curiSubGroups();
  const m = DATA.managers.find(x=>x.name===mgrName);
  if(m) return m.branches.map(b=>b.name);
  // 실제 매니저(학원·우영)가 아닌 큐리매쓰 전용 담당자(예: 정은희) — 담당 지역 목록
  const regions = new Set(CURI_DATA.filter(r=>r.mgr===mgrName).map(r=>r.region));
  return Array.from(regions).sort((a,b)=>a.localeCompare(b,'ko'));
}
function scopeLabel(scope){
  if(scope.mgr===null) return '전국';
  const mgrLabel = scope.mgr==='HQ' ? '본사(큐리매쓰)' : scope.mgr;
  const brLabel = (!scope.br || scope.br==='합산') ? '합산' : scope.br;
  return `${mgrLabel} · ${brLabel}`;
}
function renderScopePicker(scope, idPrefix, mgrChangeFn, brChangeFn, includeHQ){
  const mgrOpts = ['<option value="">전국</option>']
    .concat(DATA.managers.map(m=>`<option value="${m.name}" ${scope.mgr===m.name?'selected':''}>${m.name}</option>`));
  if(includeHQ) mgrOpts.push(`<option value="HQ" ${scope.mgr==='HQ'?'selected':''}>본사(큐리매쓰)</option>`);
  const brList = scopeBranchOptions(scope.mgr);
  const brOpts = ['<option value="">합산</option>'].concat(
    brList.map(n=>`<option value="${n}" ${scope.br===n?'selected':''}>${n}</option>`));
  return `
    <div class="home-scope-bar" data-prefix="${idPrefix}">

   전국(항상) → 매니저(선택 시) → 본부(선택 시) 순으로 KPI 열이 늘어난다.
   본사(HQ) 선택 시 실회원·신규회원은 해당 없음("—")으로 표시.

let _scope = {mgr:null, br:null};

function homeSeriesForScope(scope){
  const cats = {'전체':new Array(8).fill(0), '숲':new Array(8).fill(0), 'IGSE':new Array(8).fill(0), '우영':new Array(8).fill(0)};
  if(scope.mgr==='HQ') return cats; // 본사는 학원/우영 실회원 데이터 없음
  let branchesToSum = [];
  if(scope.mgr===null){ DATA.managers.forEach(m=>branchesToSum.push(...m.branches)); }
  else {
    const m = DATA.managers.find(x=>x.name===scope.mgr);
    if(m){
      if(!scope.br || scope.br==='합산') branchesToSum = m.branches;
      else { const b=m.branches.find(x=>x.name===scope.br); if(b) branchesToSum=[b]; }
    }
  }
  branchesToSum.forEach(b=>b.centers.forEach(c=>{
    const cat=bmCategory(c.form);
    for(let i=0;i<8;i++){ const v=c.mem[i]||0; cats['전체'][i]+=v; cats[cat][i]+=v; }

}

function curiSeriesForScope(scope){
  const out = {mem:new Array(8).fill(0), workbook:new Array(8).fill(0), textbook:new Array(8).fill(0)};
  CURI_DATA.forEach(r=>{
    let include=false;
    if(scope.mgr===null) include=true;
    else if(scope.mgr==='HQ'){
      if(r.mgr==='본사'){ include = (!scope.br||scope.br==='합산') ? true : r.sub===scope.br; }
    } else {
      if(r.mgr===scope.mgr){ include = (!scope.br||scope.br==='합산') ? true : r.region===scope.br; }
    }
    if(include) for(let i=0;i<8;i++){
      out.mem[i]+=(r.mem[i]||0); out.workbook[i]+=(r.workbook[i]||0); out.textbook[i]+=(r.textbook[i]||0);
    }
  });
  return out;
}

/* 막대 끝에 값 표시(툴팁 대신) — 차트별로 plugins:[barValueLabelPlugin] 로 등록 */
const barValueLabelPlugin = {
  id: 'barValueLabel',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((ds, dsIndex)=>{
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden) return;
      const isLine = ds.type==='line';
      const suffix = ds.valueSuffix || '';
      meta.data.forEach((el, i)=>{
        const v = ds.data[i];
        if(v===null||v===undefined) return;
        ctx.save();
        ctx.fillStyle = isLine ? (ds.borderColor||'#c0392b') : '#1c2431';
        ctx.font = isLine ? 'bold 10px sans-serif' : '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(fmtNum(v)+suffix, el.x, el.y - (isLine?8:2));
        ctx.restore();
      });
    });
  }
};

// ── 통합 KPI 격자: 열=전국/매니저/본부, 행=실회원/신규회원/큐리매쓰 ──
// 학원(숲+IGSE)/우영 센터수 — 정의: 폐업일 없는(=DATA에 존재하는) 센터 그대로 카운트
function kpiCenterCounts(scope){
  if(scope.mgr==='HQ') return {academy:0, op:0, total:0};
  let branchesToSum = [];
  if(scope.mgr===null){ DATA.managers.forEach(m=>branchesToSum.push(...m.branches)); }
  else {
    const m = DATA.managers.find(x=>x.name===scope.mgr);
    if(m){
      if(!scope.br || scope.br==='합산') branchesToSum = m.branches;
      else { const b=m.branches.find(x=>x.name===scope.br); if(b) branchesToSum=[b]; }
    }
  }
  let academy=0, op=0;
  branchesToSum.forEach(b=>b.centers.forEach(c=>{
    if(bmCategory(c.form)==='우영') op++; else academy++;
  }));
  return {academy, op, total:academy+op};
}
// 큐리매쓰 센터수 — 정의: 센터명에 "(해지)"가 없는 CURI_DATA 행 개수
function kpiCuriCenterCount(scope){
  let n=0;
  CURI_DATA.forEach(r=>{
    let include=false;
    if(scope.mgr===null) include=true;
    else if(scope.mgr==='HQ'){ if(r.mgr==='본사') include = (!scope.br||scope.br==='합산') ? true : r.sub===scope.br; }
    else { if(r.mgr===scope.mgr) include = (!scope.br||scope.br==='합산') ? true : r.region===scope.br; }
    if(include && !r.center.includes('(해지)')) n++;
  });
  return n;
}
function kpiRowData(scope){
  const bm = homeSeriesForScope(scope);
  const nw = newSeriesForScope(scope);
  const er = engRevSeriesForScope(scope);
  const cnt = kpiCenterCounts(scope);
  const curi = curiSeriesForScope(scope);
  const curiCnt = kpiCuriCenterCount(scope);
  const na = scope.mgr!==null && !DATA.managers.find(m=>m.name===scope.mgr); // HQ, 정은희 등 학원·우영 미보유 매니저
  const curiRev = (curi.workbook[7]||0)+(curi.textbook[7]||0);
  const curiRevPrev = (curi.workbook[6]||0)+(curi.textbook[6]||0);
  return {
    na,
    academy:{
      mem:(bm['숲'][7]||0)+(bm['IGSE'][7]||0), memPrev:(bm['숲'][6]||0)+(bm['IGSE'][6]||0),
      new:(nw['숲'][7]||0)+(nw['IGSE'][7]||0), newPrev:(nw['숲'][6]||0)+(nw['IGSE'][6]||0),
      rev:(er['숲'][7]||0)+(er['IGSE'][7]||0), revPrev:(er['숲'][6]||0)+(er['IGSE'][6]||0),
      centers:cnt.academy
    },
    op:{
      mem:bm['우영'][7]||0, memPrev:bm['우영'][6]||0,
      new:nw['우영'][7]||0, newPrev:nw['우영'][6]||0,
      rev:er['우영'][7]||0, revPrev:er['우영'][6]||0,
      centers:cnt.op
    },
    total:{
      mem:bm['전체'][7]||0, memPrev:bm['전체'][6]||0,
      new:nw['전체'][7]||0, newPrev:nw['전체'][6]||0,
      rev:er['전체'][7]||0, revPrev:er['전체'][6]||0,
      centers:cnt.total
    },
    curi:{
      mem:curi.mem[7]||0, memPrev:curi.mem[6]||0,
      rev:curiRev, revPrev:curiRevPrev,
      centers:curiCnt
    }
  };
}
// 전월대비 작은 표시(숫자 아래) — 센터수는 월별 이력이 없어 대상 아님
function uniDelta(cur, prev){
  const d = cur-prev;
  if(d>0) return `<div class="uni-delta up">▲+${fmtNum(d)}</div>`;
  if(d<0) return `<div class="uni-delta down">▼${fmtNum(d)}</div>`;
  return `<div class="uni-delta flat">→0</div>`;
}
// 매출 전월대비(천원 단위로 표시)
function uniDeltaWon(cur, prev){
  const d = Math.floor(cur/1000) - Math.floor(prev/1000);
  if(d>0) return `<div class="uni-delta up">▲+${fmtNum(d)}천원</div>`;
  if(d<0) return `<div class="uni-delta down">▼${fmtNum(d)}천원</div>`;
  return `<div class="uni-delta flat">→0</div>`;
}
// 전국/매니저/본부 각 행을 독립적으로 펼치고 접음
let _kpiExpanded = {nation:false, mgr:false, br:false};
function toggleKpiExpand(role){
  _kpiExpanded[role] = !_kpiExpanded[role];
  const grid = document.getElementById('uniKpiGrid');
  if(grid) grid.outerHTML = renderUnifiedKpiGrid();
}
function renderUnifiedKpiGrid(){
  const roles = [{role:'nation', label:'전국', s:{mgr:null,br:null}}];
  if(_scope.mgr!==null) roles.push({role:'mgr', label:_scope.mgr==='HQ'?'본사':_scope.mgr, s:{mgr:_scope.mgr,br:null}});
  if(_scope.br) roles.push({role:'br', label:_scope.br, s:{mgr:_scope.mgr,br:_scope.br}});

  let body = '';
  roles.forEach(r=>{
    const d = kpiRowData(r.s);
    const exp = _kpiExpanded[r.role];
    const arrow = d.na ? '' : `<span class="uni-arrow">${exp?'▾':'▸'}</span>`;
    const clickAttr = d.na ? '' : `onclick="toggleKpiExpand('${r.role}')"`;
    body += `<tr class="uni-row-main">
      <td class="uni-row-label" ${clickAttr}>${arrow} ${r.label}</td>
      <td class="num eng-cell mem-cell">${d.na?'—':`${fmtNum(d.total.mem)}명${uniDelta(d.total.mem,d.total.memPrev)}`}</td>
      <td class="num eng-cell">${d.na?'—':`${fmtWon(d.total.rev)}${uniDeltaWon(d.total.rev,d.total.revPrev)}`}</td>
      <td class="num eng-cell">${d.na?'—':`${fmtNum(d.total.new)}명${uniDelta(d.total.new,d.total.newPrev)}`}</td>
      <td class="num eng-cell">${d.na?'—':fmtNum(d.total.centers)+'개'}</td>
      <td class="num curi-cell mem-cell">${fmtNum(d.curi.mem)}명${uniDelta(d.curi.mem,d.curi.memPrev)}</td>
      <td class="num curi-cell">${fmtWon(d.curi.rev)}${uniDeltaWon(d.curi.rev,d.curi.revPrev)}</td>
      <td class="num curi-cell">${fmtNum(d.curi.centers)}개</td>
    </tr>`;
    if(exp && !d.na){
      body += `<tr class="uni-row-sub"><td class="uni-row-sublabel">└ 학원</td>
        <td class="num eng-cell mem-cell">${fmtNum(d.academy.mem)}명${uniDelta(d.academy.mem,d.academy.memPrev)}</td>
        <td class="num eng-cell">${fmtWon(d.academy.rev)}${uniDeltaWon(d.academy.rev,d.academy.revPrev)}</td>
        <td class="num eng-cell">${fmtNum(d.academy.new)}명${uniDelta(d.academy.new,d.academy.newPrev)}</td>
        <td class="num eng-cell">${fmtNum(d.academy.centers)}개</td>
        <td colspan="3" class="curi-cell"></td></tr>`;
      body += `<tr class="uni-row-sub"><td class="uni-row-sublabel">└ 우영</td>
        <td class="num eng-cell mem-cell">${fmtNum(d.op.mem)}명${uniDelta(d.op.mem,d.op.memPrev)}</td>
        <td class="num eng-cell">${fmtWon(d.op.rev)}${uniDeltaWon(d.op.rev,d.op.revPrev)}</td>
        <td class="num eng-cell">${fmtNum(d.op.new)}명${uniDelta(d.op.new,d.op.newPrev)}</td>
        <td class="num eng-cell">${fmtNum(d.op.centers)}개</td>
        <td colspan="3" class="curi-cell"></td></tr>`;
    }
  });

  return `<div id="uniKpiGrid" class="uni-kpi-wrap">
    <table class="uni-kpi-table2">
      <thead>
        <tr><th rowspan="2" class="uni-corner">구분</th><th colspan="4" class="grp-eng">영어</th><th colspan="3" class="grp-curi">큐리매쓰</th></tr>
        <tr>
          <th class="num eng-cell">실회원</th><th class="num eng-cell">매출</th><th class="num eng-cell">신규</th><th class="num eng-cell">센터수</th>
          <th class="num curi-cell">실회원</th><th class="num curi-cell">매출(합)</th><th class="num curi-cell">센터수</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
    <p class="uni-kpi-note">학원·우영 센터수 = 폐업 처리되지 않은 센터 기준 · 큐리매쓰 센터수 = 센터명에 "(해지)"가 없는 기준(8월 값) · 색 숫자는 전월(7월) 대비 증감 · 영어 매출은 데이터 연결 예정</p>
  </div>`;
}

function renderUnifiedScopePicker(){
  const curiOnlyMgrs = Array.from(new Set(CURI_DATA.map(r=>r.mgr)))
    .filter(n=>n!=='본사' && !DATA.managers.some(m=>m.name===n))
    .sort((a,b)=>a.localeCompare(b,'ko'));
  const hqOption = curiHqSubGroupsSorted().length
    ? [`<option value="HQ" ${_scope.mgr==='HQ'?'selected':''}>본사(큐리매쓰)</option>`] : [];
  const mgrOpts = ['<option value="">전국</option>']
    .concat(DATA.managers.map(m=>`<option value="${m.name}" ${_scope.mgr===m.name?'selected':''}>${m.name}</option>`))
    .concat(curiOnlyMgrs.map(n=>`<option value="${n}" ${_scope.mgr===n?'selected':''}>${n} (큐리매쓰)</option>`))
    .concat(hqOption);
  const brList = scopeBranchOptions(_scope.mgr);
  const brOpts = ['<option value="">합산</option>'].concat(
    brList.map(n=>`<option value="${n}" ${_scope.br===n?'selected':''}>${n}</option>`));
  return `
    <div class="uni-scope-bar" id="uniScopeBar">
      <label>매니저</label>
      <select onchange="uniMgrChanged(this.value)">${mgrOpts.join('')}</select>
      ${_scope.mgr!==null ? `<label>본부</label>
      <select onchange="uniBrChanged(this.value)">${brOpts.join('')}</select>
      <button class="uni-reset-btn" onclick="uniReset()" title="전국으로 초기화">↺ 초기화</button>` : ''}
      <span class="home-scope-label">현재 보기: <b>${scopeLabel(_scope)}</b></span>
    </div>`;
}
function refreshUnifiedPanel(){
  _kpiExpanded = {nation:false, mgr:false, br:false};
  const bar = document.getElementById('uniScopeBar');
  if(bar) bar.outerHTML = renderUnifiedScopePicker();
  const grid = document.getElementById('uniKpiGrid');
  if(grid) grid.outerHTML = renderUnifiedKpiGrid();
  drawHomeBmChart();
  drawEngRevChart();
  drawNewMemChart();
  drawCuriCharts();
}
function uniMgrChanged(v){
  _scope = {mgr: v===''? null : v, br:null};
  refreshUnifiedPanel();
}
function uniBrChanged(v){
  _scope.br = v===''? null : v;
  refreshUnifiedPanel();
}
function uniReset(){
  _scope = {mgr:null, br:null};
  refreshUnifiedPanel();
}

  {mgr:'윤길한', br:'수원영통', label:'수원영통(윤길한)'},

  {mgr:'황지애', br:'우영직영본부', label:'우영직영본부(황지애)'},

];
function curiRegionsByManager(){
  const map = {};
  CURI_DATA.forEach(r=>{
    if(r.mgr==='본사') return;
    map[r.mgr] = map[r.mgr] || new Set();
    map[r.mgr].add(r.region);
  });
  const out = {};
  Object.keys(map).forEach(k=> out[k] = Array.from(map[k]).sort((a,b)=>a.localeCompare(b,'ko')));
  return out;
}
function curiHqSubGroupsSorted(){
  return Array.from(new Set(CURI_DATA.filter(r=>r.mgr==='본사').map(r=>r.sub))).sort((a,b)=>a.localeCompare(b,'ko'));
}

// 표 위에 미러 스크롤바 추가(아래로 안 내려도 위에서 가로 스크롤 가능하게)
function setupTopScrollSync(topId, mainId){
  setTimeout(()=>{
    const top = document.getElementById(topId);
    const main = document.getElementById(mainId);
    if(!top || !main) return;
    const table = main.querySelector('table');
    if(!table) return;
    const inner = top.firstElementChild;
    if(inner) inner.style.width = table.scrollWidth + 'px';
    let syncing = false;
    top.onscroll = () => { if(syncing) return; syncing=true; main.scrollLeft = top.scrollLeft; syncing=false; };
    main.onscroll = () => { if(syncing) return; syncing=true; top.scrollLeft = main.scrollLeft; syncing=false; };
  }, 0);
}
let _curiListExpanded = {};
function toggleCuriListExpand(key){
  _curiListExpanded[key] = !_curiListExpanded[key];
  render();
}
function curiRegionAgg(mgr, region){
  const mem = new Array(8).fill(0), rev = new Array(8).fill(0);
  CURI_DATA.forEach(r=>{
    const match = mgr==='본사' ? (r.mgr==='본사' && r.sub===region) : (r.mgr===mgr && r.region===region);
    if(!match || r.center.includes('(해지)')) return;
    for(let i=0;i<8;i++){ mem[i]+=(r.mem[i]||0); rev[i]+=(r.workbook[i]||0)+(r.textbook[i]||0); }
  });
  return {mem, rev};
}
function curiRegionRowsHtml(mgrName, region){
  const key = mgrName+'::'+region;
  const exp = _curiListExpanded[key];
  const agg = curiRegionAgg(mgrName, region);
  const cells = agg.mem.map((v,i)=>`<td class="num curi-cell mem-cell">${fmtNum(v)}명</td><td class="num curi-cell">${fmtWon(agg.rev[i])}</td>`).join('');
  let html = `<tr class="uni-row-main"><td class="uni-row-label" onclick="toggleCuriListExpand('${jsq(key)}')"><span class="uni-arrow">${exp?'▾':'▸'}</span> ${region}</td>${cells}</tr>`;
  if(exp){
    const rows = CURI_DATA.filter(r=>(mgrName==='본사' ? (r.mgr==='본사'&&r.sub===region) : (r.mgr===mgrName&&r.region===region)) && !r.center.includes('(해지)'));
    rows.forEach(r=>{
      const cells2 = r.mem.map((v,i)=>`<td class="num curi-cell mem-cell">${v===null?'-':v}명</td><td class="num curi-cell">${fmtWon((r.workbook[i]||0)+(r.textbook[i]||0))}</td>`).join('');
      html += `<tr class="uni-row-sub"><td class="uni-row-sublabel">└ ${r.center}</td>${cells2}</tr>`;
    });
  }
  return html;
}
function renderHqCuriList(){
  const byMgr = curiRegionsByManager();
  const realNames = DATA.managers.map(m=>m.name).filter(n=>byMgr[n]);
  const extraNames = Object.keys(byMgr).filter(n=>!DATA.managers.some(m=>m.name===n)).sort((a,b)=>a.localeCompare(b,'ko'));

  let body = '';

    body += `<tr class="curi-mgr-row"><td colspan="17" class="curi-mgr-label">▸ ${mgrName}</td></tr>`;

    <div class="mirror-scroll-top" id="hqCuriListTopScroll"><div></div></div>

  setupTopScrollSync('hqCuriListTopScroll','hqCuriListMainScroll');

function acEngDetailHtml(){
  const m = DATA.managers.find(x=>x.name===_acScope.mgr);
  const b = m.branches.find(x=>x.name===_acScope.br);
  const c = b.centers.find(x=>x.name===_acScope.center);
  const t=memTrend(c), risk=riskLevel(c), tier=priorityTier(c);
  const prioLabel={1:'1순위 (감소+미면담)',2:'2순위 (저실적)',3:'3순위 (감소)',4:'4순위 (관리중)'}[tier];
